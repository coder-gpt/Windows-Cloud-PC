name: Windows-Cloud-PC

on:
  workflow_dispatch:

jobs:
  build:
    name: Starting Enhanced System
    runs-on: windows-latest
    timeout-minutes: 10080

    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16

    steps:
      - name: Download and Install Essentials
        run: |
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat" -UseBasicParsing
          cmd /c Downloads.bat

      - name: Start AnyDesk
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
            Start-Sleep -Seconds 10
          } else {
            Write-Host "ERROR: start.bat file not found — check the download."
            exit 1
          }

      - name: Continuous Monitoring and Automatic Restart
        run: |
          while ($true) {
            $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $anydesk -or $anydesk.HasExited) {
              Write-Host "Restarting AnyDesk..."
              cmd /c start.bat
            }
            Start-Sleep -Seconds 60
          }

      - name: Keep System Active
        run: |
          Start-Sleep -Seconds 604800

      - name: Secure Cleanup
        if: always()
        run: |
          Remove-Item Downloads.bat -Force -ErrorAction SilentlyContinue
          Write-Host "Cleanup completed."
